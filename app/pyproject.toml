[project]
name = "kis-report-app"
version = "0.1.0"
description = "KIS 포트폴리오 리포트 GUI + exe 빌드 (파이프라인 번들 포함)"
requires-python = ">=3.10,<3.14"
# exe 가 data-etl 스크립트를 번들·실행하므로 그 의존성까지 모두 포함한다.
dependencies = [
    "requests>=2.31",     # KIS OpenAPI 호출(api_ingest)
    "python-dotenv>=1.0", # 개발 폴백 .env
    "yfinance>=0.2",      # 현재가·재무·과거가·분할
    "numpy>=1.26",        # 스타일 회귀
    "pandas>=2.0",        # yfinance 의존
    "keyring>=24.0",      # 자격정보 암호화 저장(Windows DPAPI)
    "loguru>=0.7",        # 로그 파일(10MB 로테이션)
]

[dependency-groups]
dev = ["pyinstaller>=6.0"]   # exe 빌드

[tool.uv]
package = false
