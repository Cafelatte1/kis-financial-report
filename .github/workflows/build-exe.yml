name: Build Windows EXE

# 태그(vX.Y.Z) 푸시 시 Windows에서 exe 빌드 → Release 첨부
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1) React 대시보드 빌드(dist) — exe에 번들
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        working-directory: create-report
        run: |
          npm ci
          npm run build

      # 2) uv (app/pyproject.toml·uv.lock 으로 파이썬+의존성 관리, pyinstaller 는 dev 의존성)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3) exe 빌드 — uv run 이 uv.lock 기준으로 동기화(dev 포함) 후 실행
      - name: Build exe
        working-directory: app
        run: uv run pyinstaller build.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIS-Portfolio-Report-exe
          path: app/dist/*.exe

      # 4) 태그면 Release 에 첨부
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.exe
